# ─── Configuration Module Complémentaire Home Assistant (Local Add-on) ───
name: "PatriMon"
description: "Suivi de patrimoine personnel intelligent, temps réel et 100% souverain"
version: "1.0.5"
slug: "patrimon"
url: "https://github.com/Borelioeldos/PatriMon"
arch:
  - amd64
  - aarch64
  - armv7
  - armhf
  - i386
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8000
panel_icon: "mdi:chart-line"
panel_title: "PatriMon"
panel_admin: false
ports:
  8000/tcp: 8000
ports_description:
  8000/tcp: "Interface Web & API PatriMon (accès direct)"
map:
  - share:rw
  - config:rw
options:
  cache_ttl: 60
  currency_cache_ttl: 600
schema:
  cache_ttl: int
  currency_cache_ttl: int
